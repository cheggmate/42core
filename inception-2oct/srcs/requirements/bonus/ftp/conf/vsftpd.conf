# Standalone vsftpd server configuration
listen=YES
listen_ipv6=NO

# Access privileges
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002

# Directory messaging & logging
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# Chroot settings
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

# PAM service name
pam_service_name=vsftpd

# Passive mode configuration
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=127.0.0.1

# Disable seccomp sandbox for Docker compatibility
seccomp_sandbox=NO
