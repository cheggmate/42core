[www]
user = www-data
group = www-data

# Listen on port 9000 for FastCGI requests
listen = 9000

listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

# Crucial: Prevent PHP-FPM from clearing environment variables
clear_env = no
